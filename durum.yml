# FlowGuard ilerleme panosu - veri dosyası
# Sayfadaki tüm içerik bu dosyadan okunur. Güncellemeler yalnızca bu dosyada yapılır.
# Herkese açık yayımlanır: rapor taslağı, ham veri, model dosyası, kurum ve kişisel bilgi buraya girmez.

proje:
  ad: FlowGuard
  baslik: Makine Öğrenmesi Tabanlı Ağ Trafiği Analizi ve Siber Tehdit Tespit Sistemi
  tur: Yüksek lisans bitirme projesi
  odak: Genel doğruluk yerine yanlış alarm oranı (FPR), saldırı türü bazında tespit oranı ve sınıf dengesizliği

durum:
  son_guncelleme: 2026-11-07
  hafta: 3
  toplam_hafta: 5
  ozet: Karar eşikleri seçildi, test öncesi seçimler donduruldu ve son modeller eğitildi; test kümesi tek bir koşuyla ölçüldü, sonuçlar yorumlanıyor. Literatür taraması sürüyor (20 künye doğrulandı, 10 kaynak tam metinden incelendi).

plan:
  - hafta: 1
    tarih: 25–31 Ekim
    konu: Ortam, veri inceleme, keşifsel veri analizi (EDA), literatür taramasının başlangıcı
    durum: tamam
  - hafta: 2
    tarih: 1–7 Kasım
    konu: Ön işleme hattı (Pipeline), sınıf dengesizliği stratejileri, model eğitimi
    durum: tamam
  - hafta: 3
    tarih: 8–14 Kasım
    konu: Eşik seçimi, son modeller, testte tek ölçüm, saldırı türü bazında sonuçlar; çapraz veri seti testi koşullu
    durum: devam
  - hafta: 4
    tarih: 15–21 Kasım
    konu: Streamlit arayüzü
    durum: bekliyor
  - hafta: 5
    tarih: 22–30 Kasım
    konu: Proje raporunun tamamlanması, sunum
    durum: bekliyor

danisman_gorusu:
  - konu: Teslim ve biçim
    aciklama: Rapor için yazım kılavuzu, sayfa sınırı, teslim ve sunum tarihleri henüz bende yok.
    soru: Uymam gereken bir kılavuz, sayfa sınırı ya da yapay zeka kullanım beyanı kuralı var mı?
  - konu: Sunum ve arayüz gösterimi
    aciklama: 4. haftada Streamlit arayüzü geliştirilecek; kapsamı sunum biçimine göre belirlenecek.
    soru: Sunumda arayüzün canlı gösterimi bekleniyor mu, yoksa ekran görüntüleri yeterli mi? Sunum süresi ne kadar?
  - konu: Kısayol özelliklerinin raporlanması
    aciklama: >-
      Bazı özelliklerin (ör. başlangıç pencere değerleri) saldırgan makineye özgü bir iz taşıyabildiği
      görüldü. Ana modeller bu özelliklerle kalıyor; etkileri raporda duyarlılık analizi ve sınırlılık
      olarak veriliyor.
    soru: Bu raporlama düzeyi yeterli mi?

son_guncellemeden_bu_yana:
  - "Karar eşikleri, önceden yazılmış bir ölçüte göre eğitim kümesindeki çapraz doğrulama tahminlerinden seçildi."
  - "Saldırı türü bazında (15 etiket) raporlama tabloları hazırlandı."
  - "Test öncesinde tüm seçimler (eşikler, metrik kodu, raporlama kuralları) sürüm kontrolünde donduruldu; dört algoritma iki sınıflandırma düzeyinde tüm eğitim kümesiyle son kez eğitildi."
  - "Test kümesi tek bir koşuyla ölçüldü. Sonuçlar yorumlanıyor; yorum tamamlanınca özet olarak paylaşılacak."

sayilar:
  - ad: Okunan kaynak
    deger: 10
    hedef: 20
  - ad: Eğitilen model
    deger: 4
    hedef: 4
# "Karar kaydı" kartı yayinla.py tarafından karar_kaydi listesinin uzunluğundan otomatik eklenir.

one_cikan_bulgu:
  baslik: Özellik çıkarım aracındaki hatalar veride iz bırakıyor
  aciklama: >-
    CIC-IDS2017'yi üreten aracın (CICFlowMeter) kaynak kodu incelendi. Bayrak sütunlarının başlıkları
    ile taşıdıkları değerler birbirini tutmuyor ve bayraklar yalnızca akışın ilk paketinden sayılıyor;
    veri setindeki sabit ve kopya sütunların da kod düzeyinde nedenleri var. Bu, özelliklerin adına
    bakarak yorum yapmanın yanıltıcı olabileceğini gösteriyor.

karar_kaydi:
  - tarih: 2026-10-25
    karar: Ana sistem bir iş akışı uygulaması olmayacak; n8n yalnızca zaman kalırsa sonda isteğe bağlı bildirim eklentisi olabilir.
    gerekce: Model eğitimi için uygun değil; bulut tabanlı çalışması tekrarlanabilirlik ve veri gizliliği açısından sorunlu.
  - tarih: 2026-10-25
    karar: Tekrarlar, kaynak dosyadan bağımsız tanımla ve eğitim/test bölmesinden önce silinir (308.381 satır).
    gerekce: Aynı akışın farklı günlerde görünen kopyalarının hem eğitimde hem testte kalması önlenir.
  - tarih: 2026-10-25
    karar: Özellikleri aynı, etiketi farklı 1.396 satır silinir; etkisi duyarlılık analiziyle ölçülecek.
    gerekce: Aynı özellik vektörünün eğitim ve testte farklı etiketle görünmesi önlenir.
  - tarih: 2026-10-25
    karar: Satır silme ve değer düzeltme kuralları etiketten bağımsızdır; etiket dağılımına yalnızca etkiyi raporlamak için bakılır.
    gerekce: Etikete bakılarak seçilen kurallar sonuçlarda yanlılık yaratır.
  - tarih: 2026-10-25
    karar: Eksik değer doldurma, ölçekleme ve dengeleme (SMOTE) yalnızca eğitim verisinden öğrenilir.
    gerekce: Veri sızıntısını (data leakage) önlemek.
  - tarih: 2026-10-25
    karar: Sabit 8 sütun ve tüm satırlarda birebir eşit 5 kopya sütun düşürülür; 78 özellikten 65'i kalır.
    gerekce: >-
      Yeni bilgi taşımazlar. Kopyalar 69 özelliğin tüm çiftleri taranarak bulundu; her grupta ilk sütun
      tutulur. Neredeyse eşit çiftlere dokunulmaz; o karar eğitim verisinden yapılacak özellik seçimine bırakıldı.
  - tarih: 2026-10-25
    karar: Saldırı aileleri için literatürdeki 7 sınıflı şema (Panigrahi ve Borah, 2018) benimsendi; Heartbleed DoS/DDoS ailesinde.
    gerekce: Aile bazlı sonuçlar kendi geçici şemamıza değil yayımlanmış bir sınıflandırmaya dayanır; böylece literatürle karşılaştırılabilir.
  - tarih: 2026-10-25
    karar: Çapraz veri seti testi için CIC-UNSW-NB15 (UNSW-NB15'in CICFlowMeter ile işlenmiş sürümü) kullanılacak; yalnızca ikili sınıflandırma, ortak özellik alt kümesiyle.
    gerekce: Ana veri setiyle aynı özellik çıkarım aracından üretildiği için iki veri setinin özellikleri eşleştirilebilir; NetFlow tabanlı sürümler CIC-IDS2017'yi kapsamıyor.
  - tarih: 2026-10-25
    karar: Kapsam bitirme projesi düzeyinde tutulacak; literatür hedefi 20 kaynak.
    gerekce: Ödev metninde kaynak sayısı şartı yok; çekirdek iş (temizlik, sızıntısız değerlendirme, 4 model, yanlış alarm oranı ve saldırı türü bazında başarı, arayüz, rapor) önceliklendirildi.
  - tarih: 2026-10-26
    karar: "Değerlendirme: 15 sınıfa göre katmanlı %80/%20 bölme; eğitim kümesinde 5 katlı katmanlı çapraz doğrulama; test kümesi yalnızca en sonda bir kez kullanılır; karar eşiği katlar dışı tahminlerden seçilir."
    gerekce: Model, ayar ve eşik seçimi test kümesine bakılmadan yapılır; sonuçlar ortalama ± standart sapmayla verilir.
  - tarih: 2026-10-26
    karar: "Metrikler: yanlış alarm oranı (yanlış alarm sayısıyla birlikte), sınıf bazında recall ve precision (örnek sayılarıyla), makro F1, MCC ve precision-recall eğrisi. Accuracy tabloda yer alır ama yorumlanmaz."
    gerekce: Dengesiz veride accuracy ve ROC eğrisi iyimser görünür (Arp ve ark., 2022; Saito ve Rehmsmeier, 2015; Chicco ve Jurman, 2020).
  - tarih: 2026-10-26
    karar: Çelişkili çiftlerin %20'si ayrı bir ek test kümesinde tutulur; modeller ana test kümesine ek olarak bununla da ölçülür.
    gerekce: Etiketi belirsiz örnekleri testten tamamen çıkarmak değerlendirmeyi kolaylaştırır (Arp ve ark., 2022).
  - tarih: 2026-10-26
    karar: İlk sürümde özellik seçimi yapılmaz; eksik değer göstergeleri eğitimden öğrenilir; arayüz, eğitimdeki etiketten bağımsız temizlik kurallarının aynısını uygular.
    gerekce: Öğrenilen her adım yalnızca eğitim verisinden gelir; eğitim ve kullanım koşulları aynı kalır.
  - tarih: 2026-11-01
    karar: "Dengesizlik: ikili sınıflandırmada sınıf ağırlıklandırma; saldırı ailesi sınıflandırmasında ağırlıklandırma ve ağırlıklandırma + SMOTE karşılaştırılır. Ağırlıklar ve SMOTE her katın yalnızca kendi eğitim kısmından öğrenilir."
    gerekce: Dengeleme sızıntısız ve dört modelde aynı mantıkla yapılır; SMOTE yalnızca çok küçük sınıflara uygulanır.
  - tarih: 2026-11-01
    karar: İkili katmanda karar eşiği, katlar dışı tahminlerden önceden yazılmış bir yanlış alarm bütçesiyle seçilecek.
    gerekce: Eşik, test kümesine bakılmadan, projenin yanlış alarm odağına uygun ve önceden yazılmış bir kuralla seçilir.
  - tarih: 2026-11-03
    karar: Hedef port bilgisi model girdisinden çıkarıldı.
    gerekce: "Bu veri setinde bazı saldırı türleri tek bir hedef portla birebir eşleşiyor; model saldırı davranışı yerine portu öğrenebilir. Port'lu sonuçlar karşılaştırma için saklanır."
  - tarih: 2026-11-03
    karar: Tekrar eden ve çelişkili kayıtların temizliği, modelin kullandığı özellikler üzerinden yeniden uygulandı.
    gerekce: "Port çıkınca model açısından birbirinin aynısı olan kayıtlar oluştu; aynı kaydın hem eğitimde hem testte bulunmaması için."
  - tarih: 2026-11-07
    karar: Çapraz veri seti testi (UNSW-NB15) şimdilik yapılmıyor; 14 Kasım'da önceden yazılmış üç koşula göre yeniden değerlendirilecek.
    gerekce: Test son modellere bağlı (3. hafta); veri setinin atıf künyesi henüz doğrulanmadı.
  - tarih: 2026-11-07
    karar: 15 orijinal saldırı etiketi için ayrı model eğitilmiyor; mevcut tahminler 15 etikete göre kırılarak raporlanacak (küçük etiketlerde oran yerine sayı).
    gerekce: En ince düzeyde saldırı türü raporu, yeni model eğitmeden; çok küçük sınıflarda güvenilir model kurulamaz.
  - tarih: 2026-11-07
    karar: Ek deneyler (kısayol kontrolü, ölçekleme ablasyonu, doğrusal model için log dönüşümü) ana kurguyu değiştirmez; yalnızca eğitim kümesinde çapraz doğrulamayla değerlendirilir, test kümesine uygulanmaz.
    gerekce: Test kümesinin tek kullanımı korunur; sonuca bakarak kurgu seçilmesi önlenir. Kural deneylerden önce yazıldı.
  - tarih: 2026-11-07
    karar: Test kümesi açılmadan önce karar eşikleri, metrik betiği ve raporlama kuralları tek bir sürümde dondurulur; testte yalnızca ana modeller ölçülür.
    gerekce: Test sonucu görüldükten sonra hiçbir seçimin değiştirilememesi.
  - tarih: 2026-11-07
    karar: Çapraz veri seti testi yalnızca modelin kullandığı 64 özelliğin tamamı eşleşirse yapılır; ortak alt kümeyle yeni model kurulmaz.
    gerekce: Son modeller ek eğitim ve eşik seçimi olmadan, olduğu gibi sınanır. 25.10.2026 kararındaki 'ortak özellik alt kümesi' ifadesini daraltır.
  - tarih: 2026-11-07
    karar: İkili sınıflandırmada karar eşiği, eğitim kümesindeki çapraz doğrulama tahminlerinden, yanlış alarm oranı en fazla %0,1 olacak biçimde seçildi; aynı başarıyı veren eşikler arasında daha az yanlış alarm vereni tercih edildi.
    gerekce: Seçim kuralı ve okuma ölçütü eşik sonuçları görülmeden önce yazılıp kaydedildi; test kümesi kullanılmadı.
  - tarih: 2026-11-07
    karar: Test sonuçları yorumlanıp rapora işlenmeden panoda sayısal sonuç yayımlanmaz.
    gerekce: Sonuçların bağlamından koparılmadan, yorumuyla birlikte paylaşılması.

# Karar tablosunun altındaki "Düzeltmeler" notları (karar sayılmaz; kart sayısına eklenmez). İsteğe bağlı.
