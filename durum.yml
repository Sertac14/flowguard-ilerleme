# FlowGuard ilerleme panosu - veri dosyası
# Sayfadaki tüm içerik bu dosyadan okunur. Güncellemeler yalnızca bu dosyada yapılır.
# Herkese açık yayımlanır: rapor taslağı, ham veri, model dosyası, kurum ve kişisel bilgi buraya girmez.

proje:
  ad: FlowGuard
  baslik: Makine Öğrenmesi Tabanlı Ağ Trafiği Analizi ve Siber Tehdit Tespit Sistemi
  tur: Yüksek lisans bitirme projesi
  odak: Genel doğruluk yerine yanlış alarm oranı (FPR), saldırı türü bazında tespit oranı ve sınıf dengesizliği

durum:
  son_guncelleme: 2026-10-25
  hafta: 1
  toplam_hafta: 5
  ozet: Veri inceleme ve temizlik tamamlandı; ortak veri modülü hazır ve doğrulandı; literatür taraması sürüyor (4 temel kaynak incelendi).

plan:
  - hafta: 1
    tarih: 25–31 Ekim
    konu: Ortam, veri inceleme, keşifsel veri analizi (EDA), literatür taramasının başlangıcı
    durum: devam
  - hafta: 2
    tarih: 1–7 Kasım
    konu: Ön işleme hattı (Pipeline), sınıf dengesizliği stratejileri, model eğitimi
    durum: bekliyor
  - hafta: 3
    tarih: 8–14 Kasım
    konu: Model karşılaştırması, saldırı türü bazında metrikler, çapraz veri seti testi
    durum: bekliyor
  - hafta: 4
    tarih: 15–21 Kasım
    konu: Streamlit arayüzü
    durum: bekliyor
  - hafta: 5
    tarih: 22–30 Kasım
    konu: Proje raporunun tamamlanması, sunum
    durum: bekliyor

danisman_gorusu:
  - konu: Nadir sınıflar için raporlama düzeni
    aciklama: >-
      Heartbleed (11), SQL Injection (21) ve Infiltration (36) satırla çok küçük; tek bir
      %80/%20 bölmede test kümesine 3-8 satır düşüyor. Öneri üç katman: (1) ikili sınıflandırma
      (normal/saldırı) ana deney, (2) saldırı ailesi bazında sınıflandırma, (3) 15 sınıf yalnızca
      tekrarlı katmanlı çapraz doğrulama ile ve örnek sayılarıyla birlikte.
    soru: Bu üç katmanlı düzen uygun mu?
  - konu: Çelişkili etiketli satırların silinmesi
    aciklama: >-
      Özellikleri birebir aynı ama etiketi farklı 698 akış çifti (1.396 satır, verinin %0,055'i)
      var; hepsi normal trafik ile saldırı arasında, çoğu PortScan. Bu satırlar siliniyor;
      etkisi bir duyarlılık analiziyle ayrıca ölçülecek.
    soru: Silme + duyarlılık analizi yaklaşımı yeterli mi?
  - konu: Kapsam önceliği
    aciklama: >-
      UNSW-NB15 ile çapraz veri seti testi planda, ancak iki veri setinin özellikleri birebir
      eşleşmiyor. Takvim sıkışırsa ilk ertelenecek iş bu.
    soru: Çapraz veri seti testi sizce zorunlu mu, yoksa ek katkı olarak mı değerlendirilmeli?
  - konu: Teslim ve biçim
    aciklama: Rapor için yazım kılavuzu, sayfa sınırı, teslim ve sunum tarihleri henüz bende yok.
    soru: Uymam gereken bir kılavuz, sayfa sınırı ya da yapay zeka kullanım beyanı kuralı var mı?

son_guncellemeden_bu_yana:
  - "Literatür: 15 kaynağın künyesi doğrulandı (1. hafta hedefi 10–12 aşıldı); değerlendirme metrikleri ve makine öğrenmesi yöntem hataları üzerine temel kaynaklar eklendi."
  - Keşifsel veri analizi ortak veri modülüne bağlandı; grafikler kesin aile şemasıyla yeniden üretildi.
  - "2. haftanın ilk işi erken tamamlandı: temizlik adımları tek bir ortak veri modülünde toplandı ve tüm sayılar bağımsız bir kontrol betiğiyle doğrulandı (temizlik sonrası 2.520.859 akış, 65 özellik)."
  - Literatür tarama protokolü hazırlandı (5 eksen, arama ifadeleri, dahil etme ve dışlama ölçütleri).
  - 11 kaynağın künyesi birincil kaynaklardan doğrulandı; 4 temel kaynak tam metinden incelendi.
  - Veri incelemesindeki gözlemlerin çoğu (bayrak sütunları, yük taşımayan web saldırısı akışları, kısayol özellikleri) literatürde belgelenmiş özellik çıkarım hatalarıyla eşleşti.
  - Çapraz veri seti testi için CICFlowMeter ile işlenmiş UNSW-NB15 sürümü seçildi.

sayilar:
  - ad: Okunan kaynak
    deger: 5
    hedef: 20
  - ad: Eğitilen model
    deger: 0
    hedef: 4
# "Karar kaydı" kartı yayinla.py tarafından karar_kaydi listesinin uzunluğundan otomatik eklenir.

one_cikan_bulgu:
  baslik: Tekrar eden akışlar sınıflara eşit dağılmıyor
  grafik: grafikler/02_tekrar_orani.png
  aciklama: >-
    SSH-Patator akışlarının %45'i, PortScan akışlarının %43'ü birebir tekrar. Tekrarlar
    silinmeden yapılan bir değerlendirmede aynı akış hem eğitimde hem testte bulunabileceği için,
    en çok bu saldırı türlerinin sonuçları olduğundan iyi görünür.

karar_kaydi:
  - tarih: 2026-10-25
    karar: Ana sistem bir iş akışı uygulaması olmayacak; n8n yalnızca zaman kalırsa sonda isteğe bağlı bildirim eklentisi olabilir.
    gerekce: Model eğitimi için uygun değil; bulut tabanlı çalışması tekrarlanabilirlik ve veri gizliliği açısından sorunlu.
  - tarih: 2026-10-25
    karar: Tekrarlar, kaynak dosyadan bağımsız tanımla ve eğitim/test bölmesinden önce silinir (308.381 satır).
    gerekce: Aynı akışın farklı günlerde görünen kopyalarının hem eğitimde hem testte kalması önlenir.
  - tarih: 2026-10-25
    karar: Özellikleri aynı, etiketi farklı 1.396 satır silinir; etkisi duyarlılık analiziyle ölçülecek.
    gerekce: Aynı özellik vektörünün eğitim ve testte farklı etiketle görünmesi önlenir.
  - tarih: 2026-10-25
    karar: Satır silme ve değer düzeltme kuralları etiketten bağımsızdır; etiket dağılımına yalnızca etkiyi raporlamak için bakılır.
    gerekce: Etikete bakılarak seçilen kurallar sonuçlarda yanlılık yaratır.
  - tarih: 2026-10-25
    karar: Eksik değer doldurma, ölçekleme ve dengeleme (SMOTE) yalnızca eğitim verisinden öğrenilir.
    gerekce: Veri sızıntısını (data leakage) önlemek.
  - tarih: 2026-10-25
    karar: Sabit 8 sütun ve tüm satırlarda birebir eşit 5 kopya sütun düşürülür; 78 özellikten 65'i kalır.
    gerekce: >-
      Yeni bilgi taşımazlar. Kopyalar 69 özelliğin tüm çiftleri taranarak bulundu; her grupta ilk sütun
      tutulur. Neredeyse eşit çiftlere dokunulmaz; o karar eğitim verisinden yapılacak özellik seçimine bırakıldı.
  - tarih: 2026-10-25
    karar: Saldırı aileleri için literatürdeki 7 sınıflı şema (Panigrahi ve Borah, 2018) benimsendi; Heartbleed DoS/DDoS ailesinde.
    gerekce: Aile bazlı sonuçlar kendi geçici şemamıza değil yayımlanmış bir sınıflandırmaya dayanır; böylece literatürle karşılaştırılabilir.
  - tarih: 2026-10-25
    karar: Çapraz veri seti testi için CIC-UNSW-NB15 (UNSW-NB15'in CICFlowMeter ile işlenmiş sürümü) kullanılacak; yalnızca ikili sınıflandırma, ortak özellik alt kümesiyle.
    gerekce: Ana veri setiyle aynı özellik çıkarım aracından üretildiği için iki veri setinin özellikleri eşleştirilebilir; NetFlow tabanlı sürümler CIC-IDS2017'yi kapsamıyor.
  - tarih: 2026-10-25
    karar: Kapsam bitirme projesi düzeyinde tutulacak; literatür hedefi 20 kaynak.
    gerekce: Ödev metninde kaynak sayısı şartı yok; çekirdek iş (temizlik, sızıntısız değerlendirme, 4 model, yanlış alarm oranı ve saldırı türü bazında başarı, arayüz, rapor) önceliklendirildi.
